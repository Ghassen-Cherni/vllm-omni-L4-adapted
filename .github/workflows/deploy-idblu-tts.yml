name: Deploy ID-BLU TTS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ca-central-1
  AWS_ACCOUNT_ID: "449678530532"
  ECR_REPOSITORY: idblu-tts
  TTS_INSTANCE_NAME: idblu-staging-tts-staging
  HEALTH_URL: https://tts-staging.idblu.angelsoftwares.ca/health
  READY_URL: https://tts-staging.idblu.angelsoftwares.ca/ready
  DOCKERFILE_PATH: docker/Dockerfile.idblu_tts

jobs:
  deploy:
    name: Build, push & deploy idblu_tts to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IDBLU_TTS_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.0-${SHA}"
          ECR_REG="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${ECR_REG}/${ECR_REPOSITORY}:${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "ecr_reg=${ECR_REG}" >> $GITHUB_OUTPUT

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.ecr_reg }}/${{ env.ECR_REPOSITORY }}:staging
          build-args: |
            FORK_COMMIT=${{ github.sha }}
            WRAPPER_VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find staging TTS instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${TTS_INSTANCE_NAME}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not find staging TTS instance"
            exit 1
          fi
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging TTS via SSM
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          cat > /tmp/tts-deploy.sh << SCRIPT
          #!/bin/bash
          set -euo pipefail
          AWS_REGION="${AWS_REGION}"
          ECR_REG="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${IMAGE}"
          INSTALL_DIR="/opt/idblu-tts"
          CONTAINER_NAME="idblu-tts"

          echo "=== ECR Login ==="
          aws ecr get-login-password --region "\$AWS_REGION" | \
            sudo docker login --username AWS --password-stdin "\$ECR_REG"

          echo "=== Pulling \$IMAGE ==="
          sudo docker pull "\$IMAGE"

          echo "=== Updating docker-compose image ==="
          cd "\$INSTALL_DIR"
          sudo sed -i "s|image: .*|image: \$IMAGE|" docker-compose.yml

          echo "=== Syncing voices ==="
          sudo /usr/local/bin/idblu-tts-sync-voices.sh || true

          echo "=== Restarting TTS ==="
          sudo docker compose down 2>/dev/null || true
          sudo docker compose up -d

          sleep 10
          sudo docker ps --filter name="\$CONTAINER_NAME" --filter status=running --format '{{.Names}}' | grep -qx "\$CONTAINER_NAME"
          curl -fsS --max-time 15 http://localhost:8091/health
          curl -fsS --max-time 30 http://localhost:8091/ready
          sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          SCRIPT

          ENCODED=$(base64 -w0 /tmp/tts-deploy.sh)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | sudo bash\"]" \
            --region "$AWS_REGION" \
            --timeout-seconds 1200 \
            --query "Command.CommandId" \
            --output text)

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")
            echo "[$i/120] $STATUS"
            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac
            sleep 5
          done

      - name: Wait for idblu_tts health
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
            echo "[$i/18] HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          exit 1

      - name: Wait for idblu_tts ready
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -sf --max-time 30 -o /dev/null -w "%{http_code}" "$READY_URL" 2>/dev/null || echo "000")
            echo "[$i/18] HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          exit 1
